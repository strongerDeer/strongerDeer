# Next.js 사이트를 빌드해 GitHub Pages에 배포하는 워크플로
#
# Next.js 시작 가이드: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # 기본 브랜치에 push될 때 실행
  push:
    branches: ["main"]

  # Actions 탭에서 이 워크플로를 수동으로 실행할 수 있게 허용
  workflow_dispatch:

# GitHub Pages 배포가 가능하도록 GITHUB_TOKEN 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 하나만 허용 — 진행 중인 실행과 가장 최근 대기 실행 사이에 쌓인 실행은 건너뛴다.
# 단, 프로덕션 배포는 끝까지 완료돼야 하므로 진행 중인 실행은 취소하지 않는다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 빌드 잡
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # with:
        # Next.js 설정 파일에 basePath를 자동 주입하고
        # 서버 사이드 이미지 최적화를 비활성화한다 (https://nextjs.org/docs/api-reference/next/image#unoptimized).
        #
        # 설정을 직접 관리하려면 이 줄을 제거해도 된다.
        # static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # 패키지나 소스 파일이 바뀔 때마다 새 캐시를 생성한다.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # 소스 파일만 바뀌고 패키지는 그대로면 이전 캐시를 기반으로 다시 빌드한다.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # 배포 잡
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
